version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: kmg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kmg}
      MYSQL_USER: ${MYSQL_USER:-kmguser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kmgpassword}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - kmg-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kmg-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-kmguser}:${MYSQL_PASSWORD:-kmgpassword}@db:3306/${MYSQL_DATABASE:-kmg}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kmg-network
    volumes:
      - ./public/companies:/app/public/companies
    command: >
      sh -c "
        npx prisma migrate deploy &&
        npx prisma db seed || true &&
        node server.js
      "

volumes:
  mysql_data:
    driver: local

networks:
  kmg-network:
    driver: bridge

